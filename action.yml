name: 'Setup Go with Isolated Cache'
description: 'Install Go and cache GOCACHE/GOMODCACHE with per-job isolation, branch-aware restore, and working-set trimming.'
author: 'CloudX'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  cache-key-prefix:
    description: 'Prefix for the cache key to prevent collisions between jobs that build different things'
    required: true
  go-version:
    description: 'The Go version to download (if necessary) and use.'
    required: true
  cache-dependency-path:
    description: 'Glob for go.sum files hashed into the cache key. Go module manifests and root workspace files are also hashed.'
    required: false
    default: '**/go.sum'
  max-staleness-hours:
    description: 'Whole hours to retain GOCACHE entries before the job start time.'
    required: false
    default: '2'
  save:
    description: >-
      Whether to save the cache at the end of the job. Set it to false where the
      saved entry would never be reused (typically pull_request runs, whose cache
      is scoped to the PR ref): the job still restores the newest base-branch
      entry but skips the multi-GB upload and the trim that prepares it.
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: 'True if an exact cache key match was restored'
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: install go binary
      id: install-go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: get cache paths
      id: get-cache-paths
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - name: hash Go dependency files
      id: dependency-hash
      shell: bash
      env:
        DEPENDENCY_HASH: ${{ hashFiles(inputs.cache-dependency-path, '**/go.mod', 'go.work', 'go.work.sum') }}
      run: echo "hash=$DEPENDENCY_HASH" >> "$GITHUB_OUTPUT"
    # A pull request restores from the branch it targets (github.base_ref)
    # before the repository default branch: a repo whose PRs land on a
    # long-lived integration branch (staging) rarely has a fresh default-branch
    # entry, and a PR can only read caches from its own ref, its base ref and
    # the default branch. On a push, base_ref is empty and the fallback is the
    # default branch exactly as before; the duplicate lines are then harmless.
    #
    # Exactly one of the two steps below runs. actions/cache restores now and
    # saves in its post hook; actions/cache/restore never saves.
    - name: cache
      id: cache
      if: inputs.save == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.get-cache-paths.outputs.gocache }}
          ${{ steps.get-cache-paths.outputs.gomodcache }}
        key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ steps.dependency-hash.outputs.hash }}-${{ github.run_id }}
        restore-keys: |
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.base_ref || github.event.repository.default_branch }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.base_ref || github.event.repository.default_branch }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-
    - name: restore cache (no save)
      id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.get-cache-paths.outputs.gocache }}
          ${{ steps.get-cache-paths.outputs.gomodcache }}
        key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ steps.dependency-hash.outputs.hash }}-${{ github.run_id }}
        restore-keys: |
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.head_ref || github.ref_name }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.base_ref || github.event.repository.default_branch }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.base_ref || github.event.repository.default_branch }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-${{ steps.dependency-hash.outputs.hash }}-
          go-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-prefix }}-${{ inputs.go-version }}-${{ github.event.repository.default_branch }}-
    # Trim GOCACHE to this run's working set. This action's post-hook runs
    # in reverse declaration order: after the consumer workflow's main steps
    # populate the cache, and before actions/cache's post-save uploads it.
    # Without this, every save accretes another layer of stale compile
    # outputs (Go has no GOCACHEMAXSIZE knob, and its 5-day age trim never
    # fires anything in CI that compiles daily). Go touches mtimes on cache
    # use, so entries untouched since job start went unused this run and
    # are dropped.
    #
    # $/trim-gocache resolves to this repository at the same SHA the caller
    # pinned. A workspace-relative path like ./.github/actions/... only works
    # when the action lives in the consumer repo.
    - name: trim GOCACHE
      if: inputs.save == 'true'
      uses: $/trim-gocache
      with:
        gocache: ${{ steps.get-cache-paths.outputs.gocache }}
        max-staleness-hours: ${{ inputs.max-staleness-hours }}
